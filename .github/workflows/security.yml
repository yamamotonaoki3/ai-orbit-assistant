name: Security checks (no deployment)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - name: Print versions
        run: node --version && npm --version
      - name: Install dependencies
        run: npm ci --engine-strict --no-fund
      - name: Verify locked dependency versions
        run: npm ls --depth=0
      - name: Audit all dependencies
        run: npm audit --audit-level=moderate
      - name: Build
        run: npm run build
      - name: Verify production CSP
        run: grep -q 'Content-Security-Policy' dist/index.html
      - name: Verify no deployment workflow
        run: test ! -f .github/workflows/deploy.yml
